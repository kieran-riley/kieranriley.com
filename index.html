<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kieran Riley - Full Stack Developer</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    /* Custom Utility for Image Mask */
    .mask-image-gradient {
      -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
      mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
    }

    /* --- Animations --- */

    /* Fade In Up */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Fade In (Simple) */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* Slide In Down (for Logo) */
    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Scale Up (for Image) */
    @keyframes scaleUpFade {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* Utility Classes for Animation */
    .animate-fade-in-up {
      opacity: 0;
      /* Start hidden */
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-fade-in {
      opacity: 0;
      animation: fadeIn 1.2s ease-out forwards;
    }

    .animate-slide-down {
      opacity: 0;
      animation: slideInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-scale-up {
      opacity: 0;
      animation: scaleUpFade 1s ease-out forwards;
    }

    /* Stagger Delays */
    .delay-100 {
      animation-delay: 0.1s;
    }

    .delay-200 {
      animation-delay: 0.2s;
    }

    .delay-300 {
      animation-delay: 0.3s;
    }

    .delay-400 {
      animation-delay: 0.4s;
    }

    .delay-500 {
      animation-delay: 0.5s;
    }

    .delay-600 {
      animation-delay: 0.6s;
    }

    .delay-700 {
      animation-delay: 0.7s;
    }

    .delay-800 {
      animation-delay: 0.8s;
    }

    .delay-1000 {
      animation-delay: 1s;
    }

    .accent-name {
      position: relative;
      color: #60a5fa;
    }

    .accent-name::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: 6px;
      width: 100%;
      height: 10px;
      background: linear-gradient(90deg, rgba(96, 165, 250, 0.35), rgba(125, 211, 252, 0.2));
      filter: blur(8px);
      z-index: -1;
    }
  </style>
</head>

<body class="bg-gray-800 text-white selection:bg-blue-500 selection:text-white m-0 p-0 overflow-hidden">

  <!-- Main Wrapper -->
  <div class="relative w-screen h-screen overflow-hidden bg-gradient-to-br from-gray-700 to-gray-800">

    <!-- Full Screen Background Image with Mask -->
    <div class="absolute inset-0 z-0 animate-scale-up delay-300 mask-image-gradient pointer-events-none">
      <img src="./hero.jpg" alt="Kieran Riley" class="w-full h-full object-cover" />
    </div>

    <!-- Darken overlay for readability -->
    <div class="absolute inset-0 z-10 bg-gradient-to-br from-gray-950/80 via-slate-950/65 to-gray-900/80"></div>

    <!-- Main Layout Container -->
    <div
      class="relative z-20 w-full h-full max-w-7xl mx-auto px-6 md:px-16 flex flex-col md:flex-row items-start md:items-center justify-between gap-10 md:gap-0">

      <!-- Left Column: Title & Socials -->
      <div
        class="flex-1 w-full flex flex-col justify-center h-full pt-16 md:pt-0 z-20 space-y-8 order-1 md:order-1 md:max-w-xl">
        <div class="flex flex-col text-left">
          <h1 class="text-6xl md:text-8xl font-bold leading-tight tracking-tight animate-fade-in-up delay-200">
            Kieran
          </h1>
          <h1
            class="w-fit text-6xl md:text-8xl font-bold leading-tight tracking-tight accent-name animate-fade-in-up delay-300">
            Riley.
          </h1>
        </div>

      </div>

      <!-- Right Column: Introduction -->
      <div class="flex-1 w-full flex flex-col justify-center h-full z-20 pl-0 md:pl-20 mt-4 md:mt-0 order-2 md:order-2">
        <div class="space-y-6 max-w-2xl md:ml-auto">

          <!-- Intro Label -->
          <div
            class="flex items-center gap-3 text-gray-400 uppercase tracking-widest text-sm font-semibold animate-fade-in-up delay-400">
            <span class="w-8 h-[2px] bg-gray-400"></span>
            ABOUT ME
          </div>

          <!-- Headline -->
          <h2 class="text-3xl md:text-4xl font-semibold leading-tight animate-fade-in-up delay-500 max-w-3xl text-left">
            Profesional Full-stack Software Developer <br />
            <span class="text-2xl font-bold text-blue-400">React · Django · React Native
            </span>
          </h2>

          <!-- Paragraph -->
          <p
            class="text-gray-400 leading-relaxed text-sm md:text-base animate-fade-in-up delay-600 max-w-3xl text-left">
            Full-time for over five years building web and mobile products, I thrive on front-end craft and close
            collaboration with end users to ship features that deliver real value.
          </p>
        </div>

        <!-- Social Icons (Staggered Fade In Up) -->
        <div class="flex flex-wrap items-center gap-3 mt-5 justify-start">
          <!-- GitHub -->
          <a href="https://github.com/Kieran-Riley1" target="_blank" rel="noopener"
            class="px-4 py-2 rounded-full border border-gray-400 flex items-center gap-2 hover:bg-blue-500 hover:border-blue-500 hover:text-white transition-all duration-300 group cursor-pointer animate-fade-in-up delay-500">
            <i data-lucide="github"
              class="w-[18px] h-[18px] text-gray-300 group-hover:text-white transition-colors"></i>
            <span class="text-sm text-gray-200 group-hover:text-white">GitHub</span>
          </a>
          <!-- Instagram -->
          <a href="https://www.instagram.com/kieran.riley_/" target="_blank" rel="noopener"
            class="px-4 py-2 rounded-full border border-gray-400 flex items-center gap-2 hover:bg-blue-500 hover:border-blue-500 hover:text-white transition-all duration-300 group cursor-pointer animate-fade-in-up delay-600">
            <i data-lucide="instagram"
              class="w-[18px] h-[18px] text-gray-300 group-hover:text-white transition-colors"></i>
            <span class="text-sm text-gray-200 group-hover:text-white">Instagram</span>
          </a>
        </div>
      </div>

    </div>
  </div>

  <!-- Initialize Icons -->
  <script>
    lucide.createIcons();
  </script>
</body>

</html>
